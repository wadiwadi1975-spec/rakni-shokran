<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAKNI SHOKRAN — Smart Valet & Parking</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Cairo',Tahoma,sans-serif;background:#0A0A0A;color:#C9A86A;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 5vw}
  .logo{width:180px;height:180px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(201,168,106,0.35));margin-bottom:20px}
  h1{font-size:42px;letter-spacing:3px;font-weight:800}
  h1 span{color:#fff}
  p{color:#c9d8cf;margin-top:10px;font-size:16px;opacity:.85}
  .badge{display:inline-block;margin:18px 6px 0;padding:8px 14px;border-radius:20px;border:1px solid rgba(201,168,106,0.4);background:rgba(201,168,106,0.08);font-size:13px}
  a.btn{margin-top:22px;display:inline-block;padding:14px 28px;border-radius:12px;background:linear-gradient(135deg,#C9A86A 0%,#8C6A2A 100%);color:#000;font-weight:800;text-decoration:none}
</style>
</head>
<body>
  <img src="app/assets/logo.png" alt="RAKNI SHOKRAN" class="logo">
  <h1>RAKNI <span>SHOKRAN</span></h1>
  <p>SMART VALET & PARKING — جامعة المستقبل</p>
  <div>
    <span class="badge">📱 تطبيق موحد Student + Valet</span>
    <span class="badge">💻 لوحة تحكم Web للجامعة</span>
    <span class="badge">☁️ Multi-University SaaS</span>
  </div>
  <p style="margin-top:14px;font-size:13px;opacity:.6">MVP قيد التطوير — React Native + Expo / NestJS / PostgreSQL</p>
  <a class="btn" href="https://github.com/wadiwadi1975-spec/rakni-shokran">GitHub — rakni-shokran</a>
</body>
</html>

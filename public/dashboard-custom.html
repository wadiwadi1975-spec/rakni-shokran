<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>رَكْنِي شكراً</title>
<link rel="icon" type="image/png" sizes="512x512" href="/rakni-app-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --card:#141414; --card2:#1a1a1a; --border:#262626; --text:#f5f5f5; --muted:#a3a3a3; --accent:#C9A86A; --green:#22c55e; --red:#ef4444; --blue:#3b82f6; --yellow:#eab308; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .layout{display:grid;grid-template-columns:1fr;min-height:100vh}
  .header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
  .header h1{font-size:20px;font-weight:700}
  .header h1 span{color:var(--accent)}
  .user-pill{display:flex;align-items:center;gap:10px;background:var(--accent);color:#0a0a0a;padding:8px 16px;border-radius:20px;font-weight:600;font-size:14px}
  .user-pill .avatar{width:32px;height:32px;border-radius:50%;background:#0a0a0a;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .container{max-width:1400px;margin:0 auto;padding:24px}
  .top-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center}
  .stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:18px}
  .stat-icon.yellow{background:rgba(234,179,8,.12);color:var(--yellow)}
  .stat-icon.green{background:rgba(34,197,94,.12);color:var(--green)}
  .stat-icon.blue{background:rgba(59,130,246,.12);color:var(--blue)}
  .stat-icon.red{background:rgba(239,68,68,.12);color:var(--red)}
  .stat-value{font-size:28px;font-weight:700;margin-bottom:2px}
  .stat-label{font-size:12px;color:var(--muted)}
  .section-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab-btn{padding:10px 16px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
  .tab-btn.active{background:var(--accent);color:#0a0a0a;border-color:var(--accent)}
  .tab-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}
  .floor-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .fs{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
  .fs-name{font-size:11px;color:var(--muted);margin-bottom:4px}
  .fs-row{display:flex;justify-content:center;gap:12px;font-size:13px;font-weight:600}
  .fs-row .g{color:var(--green)} .fs-row .r{color:var(--red)} .fs-row .t{color:var(--text)}
  .grid-scroll{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(10,50px);gap:4px;width:max-content}
  .ramp{grid-column:1/-1;background:repeating-linear-gradient(45deg,#333,#333 8px,#1a1a1a 8px,#1a1a1a 16px);border-radius:6px;padding:10px 0;text-align:center;font-weight:700;font-size:12px;color:var(--accent);letter-spacing:1px}
  .ramp.exit{margin-top:4px}
  .aisle{grid-column:1/-1;background:#1a1a1a;border-top:2px dashed #333;border-bottom:2px dashed #333;height:28px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;letter-spacing:2px}
  .spot{aspect-ratio:1;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;user-select:none;transition:transform .12s,box-shadow .15s}
  .spot:hover{transform:scale(1.35);z-index:5;box-shadow:0 0 10px rgba(201,168,106,.5)}
  .spot.available{background:var(--green)} .spot.occupied{background:var(--red)} .spot.maintenance{background:var(--yellow)}
  .legend{display:flex;gap:18px;margin-top:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:6px}
  .legend-swatch{width:14px;height:14px;border-radius:4px}
  .tooltip{position:fixed;background:var(--accent);color:#0a0a0a;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;pointer-events:none;display:none;z-index:100}
  .footer{padding:20px 24px;text-align:center;color:var(--muted);font-size:11px;border-top:1px solid var(--border);margin-top:24px}
  @media(max-width:768px){.top-stats{grid-template-columns:repeat(2,1fr)}.floor-stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(10,42px)}}
</style>
</head>
<body>

<div class="header">
  <h1><span>رَكْنِي</span> شكراً</h1>
  <div class="user-pill"><div class="avatar" id="avatar">S</div><span id="user-name">...</span></div>
</div>

<div class="container">
  <div class="top-stats" id="top-stats"></div>
  <div class="section-title"><span class="dot"></span>التوفر داخل الحرم</div>
  <div class="tabs" id="tabs"></div>
  <div class="floor-stats" id="floor-stats"></div>
  <div id="grid-wrapper"><div style="text-align:center;padding:40px;color:var(--muted)">جاري التحميل...</div></div>
  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:var(--green)"></span>متاح</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--red)"></span>مشغول</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--yellow)"></span>صيانة</div>
  </div>
</div>

<div class="footer">رَكْنِي شكراً — خدمة صف السيارات الذكية — جامعة المستقبل</div>
<div class="tooltip" id="tooltip"></div>

<script>
(function(){
  var TK='rakni_access_token';
  var FL={'1':'أرضي (A)','2':'أول (B)','3':'ثاني (C)','4':'ثالث (D)'};
  var FS={'1':'A','2':'B','3':'C','4':'D'};
  var SPR=10,RPB=2,allSpots=[],curFloor=1,tok=localStorage.getItem(TK);

  function xSync(m,u,b){var x=new XMLHttpRequest();x.open(m,u,false);x.setRequestHeader('Authorization','Bearer '+tok);if(b)x.setRequestHeader('Content-Type','application/json');x.send(b?JSON.stringify(b):null);if(x.status>=200&&x.status<300)return JSON.parse(x.responseText);return null}
  function login(cb){
    if(tok){var v=xSync('GET','/api/auth/me');if(v){showUser(v);cb();return}}
    var r=xSync('POST','/api/auth/login',{email:'student@rakni.com',password:'student123'});
    if(r&&r.accessToken){tok=r.accessToken;localStorage.setItem(TK,tok)}
    var u=xSync('GET','/api/auth/me');
    if(u)showUser(u);
    cb();
  }
  function showUser(u){
    document.getElementById('user-name').textContent=u.fullName||u.email;
    document.getElementById('avatar').textContent=(u.fullName||'U')[0];
  }
  function loadSpots(){var d=xSync('GET','/api/spots');if(d&&Array.isArray(d)){allSpots=d;return true}return false}
  function updateSpot(id,s){return xSync('PATCH','/api/spots/'+id+'/status',{status:s})}
  function loadDash(){return xSync('GET','/api/dashboard')}

  function renderTopStats(){
    var d=loadDash();if(!d)return;
    document.getElementById('top-stats').innerHTML=
      '<div class="stat"><div class="stat-icon yellow">🅿</div><div class="stat-value">'+(d.activeOrders||0)+'</div><div class="stat-label">الطلبات النشطة</div></div>'+
      '<div class="stat"><div class="stat-icon green">✓</div><div class="stat-value">'+(d.availableSpots||0)+'</div><div class="stat-label">مواقف متاحة</div></div>'+
      '<div class="stat"><div class="stat-icon blue">🅿</div><div class="stat-value">'+(d.occupiedSpots||0)+'</div><div class="stat-label">مواقف مشغولة</div></div>'+
      '<div class="stat"><div class="stat-icon red">⏱</div><div class="stat-value">'+(d.completedOrders||0)+'</div><div class="stat-label">طلبات مكتملة</div></div>';
  }

  function renderTabs(){
    var el=document.getElementById('tabs');el.innerHTML='';
    [1,2,3,4].forEach(function(f){
      var b=document.createElement('button');b.className='tab-btn'+(f===curFloor?' active':'');
      b.textContent='طابق '+FL[f];b.onclick=function(){curFloor=f;renderTabs();renderFloorStats();renderGrid()};
      el.appendChild(b);
    });
  }

  function renderFloorStats(){
    var el=document.getElementById('floor-stats');el.innerHTML='';
    [1,2,3,4].forEach(function(f){
      var fs=allSpots.filter(function(s){return s.floor===f});
      var a=fs.filter(function(s){return s.status==='available'}).length;
      var o=fs.filter(function(s){return s.status==='occupied'}).length;
      var m=fs.filter(function(s){return s.status==='maintenance'}).length;
      var d=document.createElement('div');d.className='fs';
      d.innerHTML='<div class="fs-name">طابق '+FL[f]+'</div><div class="fs-row"><span class="t">'+fs.length+'</span><span class="g">'+a+'</span><span class="r">'+o+'</span></div>';
      if(f===curFloor)d.style.borderColor='var(--accent)';
      el.appendChild(d);
    });
  }

  function renderGrid(){
    var w=document.getElementById('grid-wrapper'),tip=document.getElementById('tooltip');
    var fs=allSpots.filter(function(s){return s.floor===curFloor});
    var g=document.createElement('div');g.className='grid';
    var en=document.createElement('div');en.className='ramp';en.textContent='▼ مدخل الطابق '+FS[curFloor];g.appendChild(en);
    var rsa=0;
    for(var i=0;i<fs.length;i+=SPR){
      fs.slice(i,i+SPR).forEach(function(sp){
        var c=document.createElement('div');c.className='spot '+sp.status;c.textContent=sp.spotCode;
        c.addEventListener('mouseenter',function(e){tip.textContent=sp.spotCode+(sp.status==='available'?' — متاح':sp.status==='occupied'?' — مشغول':' — صيانة');tip.style.display='block'});
        c.addEventListener('mousemove',function(e){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'});
        c.addEventListener('mouseleave',function(){tip.style.display='none'});
        c.addEventListener('click',function(){var o=['available','occupied','maintenance'];var nx=o[(o.indexOf(sp.status)+1)%o.length];if(updateSpot(sp.id,nx)){sp.status=nx;renderGrid();renderFloorStats();renderTopStats()}});
        g.appendChild(c);
      });
      rsa++;if(rsa===RPB&&i+SPR<fs.length){var a=document.createElement('div');a.className='aisle';a.textContent='↔ ممر حركة ↔';g.appendChild(a);rsa=0}
    }
    var ex=document.createElement('div');ex.className='ramp exit';ex.textContent='▲ مخرج الطابق '+FS[curFloor];g.appendChild(ex);
    w.innerHTML='';w.appendChild(g);
  }

  login(function(){
    if(loadSpots()){renderTopStats();renderTabs();renderFloorStats();renderGrid();setInterval(function(){if(loadSpots()){renderTopStats();renderFloorStats();renderGrid()}},10000)}
  });
})();
</script>
</body>
</html>

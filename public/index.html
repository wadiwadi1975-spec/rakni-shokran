    <style>
      .rakni-parking-section{background:var(--card,#141414);border:1px solid var(--border,#262626);border-radius:1rem;padding:16px}
      .rakni-parking-section .rp-title{font-size:10px;letter-spacing:.18em;color:var(--accent,#C9A86A);font-family:monospace;margin-bottom:6px}
      .rakni-parking-section .rp-subtitle{font-size:16px;font-weight:800;margin-bottom:12px}
      .rp-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
      .rp-tab{flex:1;min-width:70px;padding:8px 10px;border:1px solid var(--border,#262626);border-radius:8px;background:var(--card,#141414);color:var(--muted,#a3a3a3);font-size:12px;font-weight:600;cursor:pointer;text-align:center}
      .rp-tab.active{background:var(--accent,#C9A86A);color:#0a0a0a;border-color:var(--accent,#C9A86A)}
      .rp-legend{display:flex;gap:12px;font-size:11px;color:var(--muted,#a3a3a3);margin-bottom:8px;flex-wrap:wrap}
      .rp-legend span{display:flex;align-items:center;gap:4px}
      .rp-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
      .rp-grid-wrap{overflow-x:auto;border-radius:8px}
      .rp-grid{display:grid;grid-template-columns:repeat(10,36px);gap:3px;width:max-content}
      .rp-ramp{grid-column:1/-1;background:repeating-linear-gradient(45deg,#333,#333 6px,#1a1a1a 6px,#1a1a1a 12px);border-radius:4px;padding:6px 0;text-align:center;font-weight:700;font-size:10px;color:var(--accent,#C9A86A)}
      .rp-aisle{grid-column:1/-1;background:#1a1a1a;border-top:1px dashed #333;border-bottom:1px dashed #333;height:18px;display:flex;align-items:center;justify-content:center;color:#666;font-size:9px;letter-spacing:1px}
      .rp-spot{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;cursor:pointer;transition:transform .1s}
      .rp-spot:hover{transform:scale(1.4);z-index:5}
      .rp-spot.available{background:#22c55e}
      .rp-spot.occupied{background:#3b82f6}
      .rp-spot.reserved{background:#ef4444}
      .rp-spot.maintenance{background:#eab308}
      .rp-spot svg{width:55%;height:55%;fill:#fff}
    </style>

  <body>
    <div id="root"></div>
    <script>
    (function(){
      var tk=localStorage.getItem('rakni_access_token');
      if(!tk)return;
      var x=new XMLHttpRequest();x.open('GET','/api/auth/me',false);
      x.setRequestHeader('Authorization','Bearer '+tk);x.send();
      if(x.status!==200)localStorage.removeItem('rakni_access_token');
    })();
    </script>
    <script>
    (function(){
      var FL={'1':'أرضي (A)','2':'أول (B)','3':'ثاني (C)','4':'ثالث (D)'};
      var FS={'1':'A','2':'B','3':'C','4':'D'};
      var curFloor=1, allSpots=[];
      var injected=null;
      var tk=localStorage.getItem('rakni_access_token');
      var injectedForm=false;

      function isLoggedIn(){
        if(!tk)return false;
        var x=new XMLHttpRequest();x.open('GET','/api/auth/me',false);
        x.setRequestHeader('Authorization','Bearer '+tk);x.send();
        return x.status===200;
      }

      function xSync(m,u,b){
        var x=new XMLHttpRequest();x.open(m,u,false);
        x.setRequestHeader('Authorization','Bearer '+tk);
        if(b)x.setRequestHeader('Content-Type','application/json');
        x.send(b?JSON.stringify(b):null);
        if(x.status>=200&&x.status<300)return JSON.parse(x.responseText);
        return null;
      }

      function loadSpots(){
        var d=xSync('GET','/api/spots');
        if(d&&Array.isArray(d)){
          allSpots=d;
          var seed=curFloor;
          for(var i=0;i<allSpots.length;i++){
            if(allSpots[i].status==='available'){
              var hash=((allSpots[i].id*2654435761+seed*31)>>>0)%100;
              if(hash<8)allSpots[i].status='reserved';
              else if(hash<18)allSpots[i].status='occupied';
              else if(hash<20)allSpots[i].status='maintenance';
            }
          }
          return true;
        }
        return false;
      }

      function updateSpot(id,s){
        var apiMap={reserved:'occupied',occupied:'occupied',available:'available'};
        return xSync('PATCH','/api/spots/'+id+'/status',{status:apiMap[s]||s});
      }

      var CAR_ICON='<svg viewBox="0 0 24 24" style="width:55%;height:55%;fill:#fff"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>';
      function buildParkingHTML(){
        var fs=allSpots.filter(function(s){return s.floor===curFloor});
        var avail=fs.filter(function(s){return s.status==='available'}).length;
        var occ=fs.filter(function(s){return s.status==='occupied'}).length;
        var res=fs.filter(function(s){return s.status==='reserved'}).length;

        var h='<div class="rp-title">PARKING MAP</div>';
        h+='<div class="rp-subtitle">التوفر داخل الحرم</div>';
        h+='<div class="rp-tabs">';
        [1,2,3,4].forEach(function(f){
          h+='<button class="rp-tab'+(f===curFloor?' active':'')+'" data-floor="'+f+'">طابق '+FL[f]+'</button>';
        });
        h+='</div>';
        h+='<div class="rp-legend"><span><i style="background:#22c55e"></i> متاح '+avail+'</span><span><i style="background:#3b82f6"></i> مشغول '+occ+'</span><span><i style="background:#ef4444"></i> محجوز '+res+'</span></div>';
        h+='<div class="rp-grid-wrap"><div class="rp-grid">';
        h+='<div class="rp-ramp">▼ مدخل طابق '+FS[curFloor]+'</div>';
        var rsa=0;
        for(var i=0;i<fs.length;i+=10){
          var row=fs.slice(i,i+10);
          row.forEach(function(sp){
            h+='<div class="rp-spot '+sp.status+'" data-id="'+sp.id+'" title="'+sp.spotCode+'">'+(sp.status==='available'?sp.spotCode:CAR_ICON)+'</div>';
          });
          rsa++;
          if(rsa===2&&i+10<fs.length){
            h+='<div class="rp-aisle">↔ ممر حركة ↔</div>';
            rsa=0;
          }
        }
        h+='<div class="rp-ramp">▲ مخرج طابق '+FS[curFloor]+'</div>';
        h+='</div></div>';
        return h;
      }

      function findTargetSection(){
        var sections=document.querySelectorAll('section');
        for(var i=0;i<sections.length;i++){
          var t=sections[i].textContent;
          if(t.indexOf('التوافر داخل الحرم')>-1||t.indexOf('التوفر داخل الحرم')>-1||t.indexOf('CAMPUS MAP')>-1){
            return sections[i];
          }
        }
        return null;
      }

      function injectParking(){
        var target=findTargetSection();
        if(!target)return false;
        if(injected&&injected.parentNode===target.parentNode&&injected.nextSibling===target.nextSibling)return true;
        var wrapper=document.createElement('section');
        wrapper.className='rakni-parking-section';
        wrapper.style.cssText='border-radius:1rem;padding:16px;background:var(--card,#141414);border:1px solid var(--border,#262626)';
        wrapper.innerHTML=buildParkingHTML();
        target.parentNode.insertBefore(wrapper,target);
        target.style.display='none';
        injected=wrapper;
        bindEvents(wrapper);
        return true;
      }

      function bindEvents(el){
        el.querySelectorAll('.rp-tab').forEach(function(btn){
          btn.addEventListener('click',function(){
            curFloor=parseInt(btn.dataset.floor);
            injected=null;
            loadSpots();
            injectParking();
          });
        });
        el.querySelectorAll('.rp-spot').forEach(function(cell){
          cell.addEventListener('click',function(){
            var id=parseInt(cell.dataset.id);
            var sp=allSpots.find(function(s){return s.id===id});
            if(!sp)return;
            var order=['available','occupied','reserved'];
            var next=order[(order.indexOf(sp.status)+1)%order.length];
            if(updateSpot(id,next)){
              sp.status=next;
              injected=null;
              injectParking();
            }
          });
        });
      }

      function injectSpotPicker(){
        var dialog=document.querySelector('[data-testid="dialog-order"]');
        if(!dialog){injectedForm=false;return}
        if(injectedForm)return;
        injectedForm=true;

        var form=dialog.querySelector('form');
        if(!form)return;

        var pickerDiv=document.createElement('div');
        pickerDiv.style.cssText='background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;margin-top:4px';
        pickerDiv.innerHTML='<div style="font-size:12px;font-weight:700;margin-bottom:8px;color:#C9A86A">اختر الطابق والموقف</div>'+
          '<div id="rp-order-tabs" style="display:flex;gap:4px;margin-bottom:8px"></div>'+
          '<div id="rp-order-spots" style="display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-height:160px;overflow-y:auto"></div>'+
          '<div style="margin-top:8px;font-size:11px;color:#888">الموقف المختار: <span id="rp-order-selected" style="color:#C9A86A;font-weight:700">-</span></div>';

        var label2=form.querySelectorAll('label')[1];
        if(label2){label2.parentNode.insertBefore(pickerDiv,label2)}

        var orderFloor=1, selectedSpotCode=null;

        function renderOrderTabs(){
          var tabsDiv=document.getElementById('rp-order-tabs');
          if(!tabsDiv)return;
          tabsDiv.innerHTML='';
          [1,2,3,4].forEach(function(f){
            var btn=document.createElement('button');
            btn.type='button';
            btn.style.cssText='flex:1;padding:6px;border:1px solid #333;border-radius:6px;background:'+(f===orderFloor?'#C9A86A':'#141414')+';color:'+(f===orderFloor?'#0a0a0a':'#a3a3a3')+';font-size:11px;font-weight:600;cursor:pointer;text-align:center';
            btn.textContent='طابق '+FL[f];
            btn.onclick=function(){orderFloor=f;selectedSpotCode=null;renderOrderTabs();renderOrderSpots()};
            tabsDiv.appendChild(btn);
          });
        }

        function renderOrderSpots(){
          var spotsDiv=document.getElementById('rp-order-spots');
          if(!spotsDiv)return;
          spotsDiv.innerHTML='';
          var fs=allSpots.filter(function(s){return s.floor===orderFloor});
          fs.forEach(function(sp){
            var cell=document.createElement('div');
            cell.style.cssText='aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;cursor:pointer;transition:transform .1s;background:'+
              (sp.status==='available'?'#22c55e':sp.status==='occupied'?'#3b82f6':sp.status==='reserved'?'#ef4444':'#eab308');
            cell.textContent=sp.spotCode;
            cell.title=sp.spotCode+(sp.status==='available'?' (متاح)':' (مشغول)');
            if(sp.status!=='available'){cell.style.opacity='0.4';cell.style.cursor='not-allowed'}
            cell.onmouseenter=function(){if(sp.status==='available')cell.style.transform='scale(1.3)'};
            cell.onmouseleave=function(){cell.style.transform='scale(1)'};
            cell.onclick=function(){
              if(sp.status!=='available')return;
              selectedSpotCode=sp.spotCode;
              document.getElementById('rp-order-selected').textContent=sp.spotCode;
              spotsDiv.querySelectorAll('div').forEach(function(c){c.style.outline='none';c.style.outlineOffset='0'});
              cell.style.outline='2px solid #C9A86A';
              cell.style.outlineOffset='2px';
            };
            spotsDiv.appendChild(cell);
          });
        }

        renderOrderTabs();
        renderOrderSpots();

        var origSubmit=form.onsubmit;
        form.addEventListener('submit',function(e){
          if(selectedSpotCode){
            var input=document.createElement('input');
            input.type='hidden';input.name='preferredSpotCode';input.value=selectedSpotCode;
            form.appendChild(input);
          }
        },true);

        var origFetch=window.fetch;
        if(!window._rakniFetchPatched){
          window._rakniFetchPatched=true;
          window.fetch=function(){
            var url=arguments[0];
            var opts=arguments[1]||{};
            if(typeof url==='string'&&url.indexOf('/api/orders')>-1&&opts.method==='POST'){
              try{
                var body=JSON.parse(opts.body);
                if(selectedSpotCode){
                  body.preferredSpotCode=selectedSpotCode;
                  body.preferredFloor=orderFloor;
                }
                opts.body=JSON.stringify(body);
              }catch(e){}
            }
            return origFetch.apply(this,arguments);
          };
        }
      }

      function injectAdminNav(){
        if(document.getElementById('rakni-admin-link'))return;
        var tk2=localStorage.getItem('rakni_access_token');
        var role=null;
        try{var x2=new XMLHttpRequest();x2.open('GET','/api/auth/me',false);x2.setRequestHeader('Authorization','Bearer '+tk2);x2.send();if(x2.status===200)role=JSON.parse(x2.responseText).role;}catch(e){}
        var nav=document.querySelector('aside nav')||document.querySelector('nav');
        if(!nav){
          var asides=document.querySelectorAll('aside');
          if(asides.length) nav=asides[0];
        }
        if(!nav) return;
        var a=document.createElement('a');
        a.id='rakni-admin-link';
        a.href='/admin-dashboard.html';
        a.style.cssText='display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;margin-top:6px;font-size:13px;font-weight:700;background:#F5C518;color:#171819;cursor:pointer;text-decoration:none;';
        a.innerHTML='🛡️ لوحة الإدارة';
        var links=nav.querySelectorAll('a,button');
        if(links.length){links[links.length-1].parentNode.insertBefore(a,links[links.length-1].nextSibling);} else {nav.appendChild(a);}
        injectClockWidget(a);
      }
      function injectClockWidget(afterEl){
        if(document.getElementById('rakni-clock-wrap'))return;
        var wrap=document.createElement('div');
        wrap.id='rakni-clock-wrap';
        wrap.style.cssText='margin-top:14px;padding:12px;background:linear-gradient(145deg,#1C303F,#0f202e);border:1px solid #C9A86A33;border-radius:16px;text-align:center';
        wrap.innerHTML='<div id="rakni-clock" style="position:relative;width:150px;height:150px;margin:0 auto;border-radius:50%;background:radial-gradient(ellipse at 25% 25%, #2a2a2a 0%, #0a0a0a 70%);border:6px solid #C9A86A;box-shadow:0 0 0 1px #8a6d2b, 0 10px 36px rgba(0,0,0,.6), inset 0 2px 14px rgba(201,168,106,.2);overflow:hidden"><div style="position:absolute;left:50%;top:50%;width:92px;height:92px;transform:translate(-50%,-50%);border-radius:50%;background:#FFC00A url(\'/rakni-app-icon.png\') center/88% no-repeat;border:3px solid #0a0a0a;box-shadow:0 0 0 4px #FFC00A, 0 4px 16px rgba(0,0,0,.5)"></div><div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.1) 0%, transparent 55%)"></div><div style="position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(201,168,106,.15)"></div><div id="rakni-markers"></div><div id="rakni-hour" style="position:absolute;left:50%;bottom:50%;width:6px;height:38px;background:linear-gradient(to top,#8a6d2b,#C9A86A 50%,#f0d48a);margin-left:-3px;transform-origin:50% 100%;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.6)"></div><div id="rakni-minute" style="position:absolute;left:50%;bottom:50%;width:4px;height:56px;background:linear-gradient(to top,#8a6d2b,#C9A86A 50%,#f0d48a);margin-left:-2px;transform-origin:50% 100%;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div><div id="rakni-second" style="position:absolute;left:50%;bottom:50%;width:1.5px;height:62px;background:#f0d48a;margin-left:-0.75px;transform-origin:50% 100%"></div><div style="position:absolute;left:50%;top:50%;width:14px;height:14px;background:radial-gradient(circle,#f0d48a 0%,#C9A86A 60%,#8a6d2b 100%);border:1px solid #5a4a1a;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 1px 6px rgba(0,0,0,.7)"></div></div><div style="margin-top:12px;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))"><div style="font-family:Cairo,sans-serif;font-size:11px;font-weight:800;color:#C9A86A;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.8), 0 0 8px rgba(201,168,106,.3)">جامعة مصر للعلوم والتكنولوجيا</div><div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px"><span style="flex:1;height:1px;background:linear-gradient(to right,transparent,#C9A86A)"></span><span style="font-size:14px;font-weight:800;color:#f0d48a;letter-spacing:.2em;text-shadow:0 1px 3px rgba(0,0,0,.8)">( MUST )</span><span style="flex:1;height:1px;background:linear-gradient(to left,transparent,#C9A86A)"></span></div></div><div id="rakni-clock-digital" style="margin-top:6px;font-family:monospace;font-size:11px;color:#C9A86A;letter-spacing:.05em;text-align:center"></div>';
        afterEl.parentNode.insertBefore(wrap,afterEl.nextSibling);
        (function(){
          var mc=document.getElementById('rakni-markers');
          if(!mc) return;
          for(var i=0;i<12;i++){
            var major=i%3===0;
            var el=document.createElement('div');
            el.style.cssText='position:absolute;left:50%;top:50%;width:'+(major?'4px':'2px')+';height:'+(major?'16px':'7px')+';background:'+(major?'linear-gradient(to bottom,#f0d48a,#C9A86A)':'#C9A86A')+';border-radius:1px;transform:translate(-50%,-50%) rotate('+(i*30)+'deg) translateY(-62px);box-shadow:0 1px 2px rgba(0,0,0,.5)';
            mc.appendChild(el);
          }
        })();
        function tick(){
          var now=new Date();
          var h=now.getHours()%12, m=now.getMinutes(), s=now.getSeconds();
          var hd=(h + m/60)*30, md=(m + s/60)*6, sd=s*6;
          var he=document.getElementById('rakni-hour'), me=document.getElementById('rakni-minute'), se=document.getElementById('rakni-second'), de=document.getElementById('rakni-clock-digital');
          if(he) he.style.transform='translateX(-50%) rotate('+hd+'deg)';
          if(me) me.style.transform='translateX(-50%) rotate('+md+'deg)';
          if(se) se.style.transform='translateX(-50%) rotate('+sd+'deg)';
          if(de) de.textContent=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
        }
        tick(); setInterval(tick,1000);
      }

      function injectDateTime(){
        var old=document.getElementById('rakni-datetime');
        if(old) old.remove();
        var els=document.querySelectorAll('p,span,div');
        var target=null;
        for(var i=0;i<els.length;i++){
          var t=els[i].textContent.trim();
          if(t.indexOf('TODAY')>-1 && t.length<30){
            target=els[i];break;
          }
        }
        if(!target) return;
        function tick(){
          var now=new Date();
          var dateStr=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
          var timeStr=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
          target.textContent=dateStr+' • '+timeStr;
          target.style.direction='ltr';
          target.style.fontFamily='monospace';
          target.style.fontSize='14px';
          target.style.fontWeight='700';
          target.style.letterSpacing='0.02em';
        }
        if(!target.dataset.rakniPatched){
          target.dataset.rakniPatched='1';
          setInterval(tick,1000);
        }
        tick();
      }
      function injectNotifBell(){
        if(document.getElementById('rakni-notif-bell'))return;
        var header=document.querySelector('header')||document.querySelector('[class*=header]');
        if(!header) return;
        var bell=document.createElement('div');
        bell.id='rakni-notif-bell';
        bell.style.cssText='position:relative;cursor:pointer;font-size:20px;padding:6px';
        bell.innerHTML='🔔<span id="rakni-notif-count" style="position:absolute;top:0;right:0;background:#ef4444;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;display:none">0</span>';
        var box=document.createElement('div');
        box.id='rakni-notif-box';
        box.style.cssText='display:none;position:absolute;top:36px;right:0;width:300px;max-height:360px;overflow:auto;background:#fff;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:9999;padding:8px';
        bell.appendChild(box);
        bell.onclick=function(e){
          e.stopPropagation();
          box.style.display=box.style.display==='none'?'block':'none';
          if(box.style.display==='block') renderNotifBox();
        };
        document.addEventListener('click',function(){box.style.display='none'});
        header.appendChild(bell);
        setInterval(renderNotifBox,5000);
        renderNotifBox();
        function renderNotifBox(){
          var notifs=JSON.parse(localStorage.getItem('rakni_notifs')||'[]');
          var countEl=document.getElementById('rakni-notif-count');
          if(countEl){countEl.textContent=notifs.length;countEl.style.display=notifs.length?'block':'none'}
          box.innerHTML='';
          if(!notifs.length){box.innerHTML='<div style="padding:12px;text-align:center;color:#64748b;font-size:12px">لا توجد إشعارات</div>';return}
          var icons={expiry:'⏰',renewal:'🔄',paid:'✅',fine:'⚠️',offer:'🎁'};
          notifs.slice().reverse().forEach(function(n){
            var div=document.createElement('div');
            div.style.cssText='padding:8px;border-bottom:1px solid #F1F5F9;font-size:12px';
            div.innerHTML='<div style="font-weight:700;margin-bottom:2px">'+(icons[n.type]||'🔔')+' '+(n.type||'')+'</div><div style="color:#334155">'+n.msg+'</div><div style="color:#94a3b8;font-size:10px;margin-top:2px">'+new Date(n.time).toLocaleString()+' - إلى: '+n.to+'</div>';
            box.appendChild(div);
          });
        }
      }

      function tryInject(){
        if(!isLoggedIn())return;
        injectAdminNav();
        injectNotifBell();
        injectDateTime();
        if(injectParking())return;
        var tries=0;
        var timer=setInterval(function(){
          tries++;
          if(injectParking()||tries>100)clearInterval(timer);
        },200);
      }

      if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',function(){
          if(isLoggedIn()){loadSpots();tryInject()}
        });
      }else{
        if(isLoggedIn()){loadSpots();tryInject()}
      }

      var lastUrl=location.href;
      var navObs=new MutationObserver(function(){
        if(location.href!==lastUrl){lastUrl=location.href;injected=null;injectedForm=false;if(isLoggedIn())tryInject()}
        if(isLoggedIn()){injectAdminNav();injectNotifBell();injectDateTime();injectSpotPicker();}
      });
      navObs.observe(document.body,{childList:true,subtree:true});

      setInterval(function(){
        if(!isLoggedIn())return;
        injectAdminNav();
        injectNotifBell();
        injectDateTime();
        if(!injected||!injected.parentNode){
          injected=null;
          loadSpots();
          injectParking();
        }
        injectSpotPicker();
      },3000);
    })();
    </script>
  </body>
</html>

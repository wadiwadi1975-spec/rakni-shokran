  <body>
    <div id="root"></div>
    <script>
      var setVal=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;
      function fillInput(inp,val){
        if(inp.value)return;
        setVal.call(inp,val);
        inp.dispatchEvent(new Event('input',{bubbles:true}));
      }
      setInterval(function(){
        var all=document.querySelectorAll('input');
        all.forEach(function(inp){
          var ph=(inp.placeholder||'').toLowerCase();
          var type=(inp.type||'').toLowerCase();
          if(!inp.value&&(ph.indexOf('\u0628\u0631\u064A\u062F')>-1||ph.indexOf('email')>-1||ph.indexOf('e-mail')>-1)){
            fillInput(inp,'student@rakni.com');
          }
          if(!inp.value&&(ph.indexOf('\u0627\u0644\u0643\u0644\u0645\u0629')>-1||ph.indexOf('password')>-1||type==='password')){
            fillInput(inp,'student123');
          }
        });
      },500);
    </script>
  </body>

  <body>
    <div id="root"></div>
    <script>
      (function(){
        function doLogin(){
          var x=new XMLHttpRequest();
          x.open('POST','/api/auth/login',false);
          x.setRequestHeader('Content-Type','application/json');
          x.send(JSON.stringify({email:'student@rakni.com',password:'student123'}));
          if(x.status===200){
            var d=JSON.parse(x.responseText);
            if(d.accessToken){localStorage.setItem('rakni_access_token',d.accessToken);return true;}
          }
          return false;
        }
        function checkToken(tk){
          var x=new XMLHttpRequest();
          x.open('GET','/api/auth/me',false);
          x.setRequestHeader('Authorization','Bearer '+tk);
          x.send();
          return x.status===200;
        }
        var tk=localStorage.getItem('rakni_access_token');
        if(tk&&checkToken(tk))return;
        if(!doLogin())return;
        location.replace(location.href);
      })();
    </script>

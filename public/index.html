  <body>
    <div id="root"></div>
    <script>
      (async function(){
        var tk=localStorage.getItem('rakni_access_token');
        if(tk)return;
        try{
          var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'student@rakni.com',password:'student123'})});
          var d=await r.json();
          if(d.token){
            localStorage.setItem('rakni_access_token',d.token);
            localStorage.setItem('rakni_user',JSON.stringify(d.user));
            location.reload();
          }
        }catch(e){}
      })();

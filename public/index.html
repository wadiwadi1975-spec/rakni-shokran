  <body>
    <div id="root"></div>
    <script>
      var _set=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;
      function reactFill(inp,val){
        if(!inp||inp.value)return;
        _set.call(inp,val);
        inp.dispatchEvent(new InputEvent('input',{bubbles:true,data:val,inputType:'insertText'}));
      }
      new MutationObserver(function(){
        var em=document.querySelector('[data-testid="input-email"]');
        var pw=document.querySelector('[data-testid="input-password"]');
        if(em)reactFill(em,'student@rakni.com');
        if(pw)reactFill(pw,'student123');
      }).observe(document.body,{childList:true,subtree:true});
    </script>
  </body>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>رَكْنِي — مخطط المواقف</title>
<link rel="icon" type="image/png" sizes="512x512" href="/rakni-app-icon.png" />
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --border: #262626;
    --text: #f5f5f5;
    --text-muted: #a3a3a3;
    --accent: #C9A86A;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --yellow: #eab308;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header h1 span { color: var(--accent); }
  .header .back { color: var(--accent); text-decoration: none; font-size: 14px; cursor: pointer; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn { flex: 1; min-width: 100px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .tab-btn.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
  .tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 100px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.yellow { color: var(--yellow); }
  .grid-scroll { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(10, 50px); gap: 4px; width: max-content; }
  .ramp { grid-column: 1 / -1; background: repeating-linear-gradient(45deg, #333, #333 8px, #1a1a1a 8px, #1a1a1a 16px); border-radius: 6px; padding: 10px 0; text-align: center; font-weight: 700; font-size: 12px; color: var(--accent); letter-spacing: 1px; }
  .ramp.exit { margin-top: 4px; }
  .aisle { grid-column: 1 / -1; background: #1a1a1a; border-top: 2px dashed #333; border-bottom: 2px dashed #333; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 11px; letter-spacing: 2px; }
  .spot { aspect-ratio: 1; border-radius: 5px; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1; white-space: nowrap; overflow: hidden; font-size: 8px; font-weight: 700; color: #fff; user-select: none; transition: transform .12s, box-shadow .15s; }
  .spot:hover { transform: scale(1.35); z-index: 5; box-shadow: 0 0 10px rgba(201,168,106,.5); }
  .spot.available { background: var(--green); }
  .spot.occupied { background: var(--red); }
  .spot.maintenance { background: var(--yellow); }
  .legend { display: flex; gap: 18px; margin-top: 16px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 4px; }
  .tooltip { position: fixed; background: var(--accent); color: #0a0a0a; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; pointer-events: none; display: none; z-index: 100; }
  .loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 16px; }
  @media (max-width: 768px) { .grid { grid-template-columns: repeat(10, 44px); } .stats { flex-direction: column; } }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(10, 38px); } }
</style>
</head>
<body>

<div class="header">
  <h1><span>رَكْنِي</span> شكراً — مخطط المواقف</h1>
  <a class="back" href="/">← العودة</a>
</div>

<div class="container">
  <div class="tabs" id="tabs"></div>
  <div class="stats" id="stats"></div>
  <div id="grid-wrapper">
    <div class="loading" id="loading">جاري تحميل الموقف...</div>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:var(--green)"></span>متاح</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--red)"></span>مشغول</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--yellow)"></span>صيانة</div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function(){
  var TOKEN_KEY = 'rakni_access_token';
  var FLOOR_LABELS = {'1':'طابق أرضي (A)','2':'طابق أول (B)','3':'طابق ثاني (C)','4':'طابق ثالث (D)'};
  var FLOOR_LETTERS = {'1':'A','2':'B','3':'C','4':'D'};
  var SPOTS_PER_ROW = 10;
  var ROWS_PER_BAY = 2;
  var allSpots = [];
  var currentFloor = 1;
  var token = localStorage.getItem(TOKEN_KEY);

  function autoLogin(cb) {
    if (!token) { doLogin(cb); return; }
    var x = new XMLHttpRequest();
    x.open('GET', '/api/auth/me', false);
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    x.send();
    if (x.status === 200) { cb(); return; }
    doLogin(cb);
  }

  function doLogin(cb) {
    var x = new XMLHttpRequest();
    x.open('POST', '/api/auth/login', false);
    x.setRequestHeader('Content-Type', 'application/json');
    x.send(JSON.stringify({email:'student@rakni.com',password:'student123'}));
    if (x.status === 200) {
      var d = JSON.parse(x.responseText);
      if (d.accessToken) { token = d.accessToken; localStorage.setItem(TOKEN_KEY, token); }
    }
    cb();
  }

  function api(method, url, body) {
    var x = new XMLHttpRequest();
    x.open(method, url, false);
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.send(body ? JSON.stringify(body) : null);
    if (x.status >= 200 && x.status < 300) return JSON.parse(x.responseText);
    return null;
  }

  function loadSpots() {
    var data = api('GET', '/api/spots');
    if (!data || !Array.isArray(data)) return false;
    allSpots = data;
    return true;
  }

  function updateSpot(spotId, newStatus) {
    return api('PATCH', '/api/spots/' + spotId + '/status', { status: newStatus });
  }

  function renderTabs() {
    var el = document.getElementById('tabs');
    el.innerHTML = '';
    [1,2,3,4].forEach(function(f) {
      var btn = document.createElement('button');
      btn.className = 'tab-btn' + (f === currentFloor ? ' active' : '');
      btn.textContent = FLOOR_LABELS[f];
      btn.onclick = function() { currentFloor = f; renderTabs(); renderGrid(); };
      el.appendChild(btn);
    });
  }

  function renderStats() {
    var floorSpots = allSpots.filter(function(s){ return s.floor === currentFloor; });
    var avail = floorSpots.filter(function(s){ return s.status === 'available'; }).length;
    var occ = floorSpots.filter(function(s){ return s.status === 'occupied'; }).length;
    var maint = floorSpots.filter(function(s){ return s.status === 'maintenance'; }).length;
    var total = floorSpots.length;
    document.getElementById('stats').innerHTML =
      '<div class="stat-card"><div class="stat-label">المجموع</div><div class="stat-value">' + total + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">متاح</div><div class="stat-value green">' + avail + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">مشغول</div><div class="stat-value red">' + occ + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">صيانة</div><div class="stat-value yellow">' + maint + '</div></div>';
  }

  function renderGrid() {
    var wrapper = document.getElementById('grid-wrapper');
    var tooltip = document.getElementById('tooltip');
    var floorSpots = allSpots.filter(function(s){ return s.floor === currentFloor; });
    var grid = document.createElement('div');
    grid.className = 'grid';

    var entrance = document.createElement('div');
    entrance.className = 'ramp';
    entrance.textContent = '▼ مدخل الطابق ' + FLOOR_LETTERS[currentFloor];
    grid.appendChild(entrance);

    var rowsSinceAisle = 0;
    for (var i = 0; i < floorSpots.length; i += SPOTS_PER_ROW) {
      var rowSpots = floorSpots.slice(i, i + SPOTS_PER_ROW);
      rowSpots.forEach(function(spot) {
        var cell = document.createElement('div');
        cell.className = 'spot ' + spot.status;
        cell.textContent = spot.spotCode;

        cell.addEventListener('mouseenter', function(e) {
          var label = spot.spotCode + ' — ';
          if (spot.status === 'available') label += 'متاح';
          else if (spot.status === 'occupied') label += 'مشغول';
          else label += 'صيانة';
          tooltip.textContent = label;
          tooltip.style.display = 'block';
        });
        cell.addEventListener('mousemove', function(e) {
          tooltip.style.left = (e.clientX + 14) + 'px';
          tooltip.style.top = (e.clientY + 14) + 'px';
        });
        cell.addEventListener('mouseleave', function() { tooltip.style.display = 'none'; });

        cell.addEventListener('click', function() {
          var order = ['available', 'occupied', 'maintenance'];
          var next = order[(order.indexOf(spot.status) + 1) % order.length];
          var result = updateSpot(spot.id, next);
          if (result) { spot.status = next; renderGrid(); renderStats(); }
        });

        grid.appendChild(cell);
      });

      rowsSinceAisle++;
      var isLastRow = i + SPOTS_PER_ROW >= floorSpots.length;
      if (rowsSinceAisle === ROWS_PER_BAY && !isLastRow) {
        var aisle = document.createElement('div');
        aisle.className = 'aisle';
        aisle.textContent = '↔ ممر حركة ↔';
        grid.appendChild(aisle);
        rowsSinceAisle = 0;
      }
    }

    var exit = document.createElement('div');
    exit.className = 'ramp exit';
    exit.textContent = '▲ مخرج الطابق ' + FLOOR_LETTERS[currentFloor];
    grid.appendChild(exit);

    wrapper.innerHTML = '';
    wrapper.appendChild(grid);
  }

  autoLogin(function() {
    if (loadSpots()) {
      renderTabs(); renderStats(); renderGrid();
      setInterval(function() { if (loadSpots()) { renderStats(); renderGrid(); } }, 10000);
    } else {
      document.getElementById('loading').textContent = 'خطأ في تحميل البيانات';
    }
  });
})();
</script>
</body>
</html>

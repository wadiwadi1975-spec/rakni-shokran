<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>رَكْنِي — مخطط المواقف</title>
<link rel="icon" type="image/png" sizes="512x512" href="/rakni-app-icon.png" />
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --border: #262626;
    --text: #f5f5f5;
    --text-muted: #a3a3a3;
    --accent: #C9A86A;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --yellow: #eab308;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header h1 span { color: var(--accent); }
  .header .back { color: var(--accent); text-decoration: none; font-size: 14px; cursor: pointer; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn {
    flex: 1; min-width: 100px; padding: 12px 16px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); color: var(--text-muted);
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .tab-btn.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
  .tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card {
    flex: 1; min-width: 120px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; text-align: center;
  }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-value { font-size: 24px; font-weight: 700; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.yellow { color: var(--yellow); }
  .grid {
    display: grid; grid-template-columns: repeat(25, 1fr); gap: 3px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  .spot {
    aspect-ratio: 1; border-radius: 4px; cursor: pointer;
    transition: transform .1s, box-shadow .15s; position: relative;
  }
  .spot:hover { transform: scale(1.3); z-index: 5; box-shadow: 0 0 8px rgba(201,168,106,.4); }
  .spot.available { background: var(--green); }
  .spot.occupied { background: var(--red); }
  .spot.maintenance { background: var(--yellow); }
  .legend { display: flex; gap: 18px; margin-top: 16px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 4px; }
  .tooltip {
    position: fixed; background: var(--accent); color: #0a0a0a;
    padding: 6px 12px; border-radius: 8px; font-size: 13px;
    font-weight: 600; pointer-events: none; display: none; z-index: 100;
  }
  .loading {
    text-align: center; padding: 60px; color: var(--text-muted); font-size: 16px;
  }
  .spot-count-label {
    text-align: center; margin-top: 8px; font-size: 12px; color: var(--text-muted);
  }
  @media (max-width: 768px) {
    .grid { grid-template-columns: repeat(15, 1fr); gap: 2px; padding: 10px; }
    .stats { flex-direction: column; }
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(10, 1fr); }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>رَكْنِي</span> شكراً — مخطط المواقف</h1>
  <a class="back" href="/">← العودة للرئيسية</a>
</div>

<div class="container">
  <div class="tabs" id="tabs"></div>
  <div class="stats" id="stats"></div>
  <div id="grid-wrapper">
    <div class="loading" id="loading">جاري تحميل الموقف...</div>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:var(--green)"></span>متاح</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--red)"></span>مشغول</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--yellow)"></span>صيانة</div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function(){
  var TOKEN_KEY = 'rakni_access_token';
  var FLOOR_LABELS = {'1':'طابق أرضي (A)','2':'طابق أول (B)','3':'طابق ثاني (C)','4':'طابق ثالث (D)'};
  var FLOOR_LETTERS = {'1':'A','2':'B','3':'C','4':'D'};
  var allSpots = [];
  var currentFloor = 1;
  var token = localStorage.getItem(TOKEN_KEY);

  function setVal(inp, val) {
    var setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;
    setter.call(inp, val);
    inp.dispatchEvent(new Event('input',{bubbles:true}));
  }

  function autoLogin(cb) {
    if (!token) {
      doLogin(cb);
      return;
    }
    var x = new XMLHttpRequest();
    x.open('GET', '/api/auth/me', false);
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    x.send();
    if (x.status === 200) { cb(); return; }
    doLogin(cb);
  }

  function doLogin(cb) {
    var x = new XMLHttpRequest();
    x.open('POST', '/api/auth/login', false);
    x.setRequestHeader('Content-Type', 'application/json');
    x.send(JSON.stringify({email:'student@rakni.com',password:'student123'}));
    if (x.status === 200) {
      var d = JSON.parse(x.responseText);
      if (d.accessToken) {
        token = d.accessToken;
        localStorage.setItem(TOKEN_KEY, token);
      }
    }
    cb();
  }

  function api(method, url, body) {
    var x = new XMLHttpRequest();
    x.open(method, url, false);
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    if (body) { x.setRequestHeader('Content-Type', 'application/json'); }
    x.send(body ? JSON.stringify(body) : null);
    if (x.status >= 200 && x.status < 300) {
      return JSON.parse(x.responseText);
    }
    return null;
  }

  function loadSpots() {
    var data = api('GET', '/api/spots');
    if (!data || !Array.isArray(data)) return false;
    allSpots = data;
    return true;
  }

  function updateSpot(spotId, newStatus) {
    return api('PATCH', '/api/spots/' + spotId + '/status', { status: newStatus });
  }

  function renderTabs() {
    var el = document.getElementById('tabs');
    el.innerHTML = '';
    [1,2,3,4].forEach(function(f) {
      var btn = document.createElement('button');
      btn.className = 'tab-btn' + (f === currentFloor ? ' active' : '');
      btn.textContent = FLOOR_LABELS[f];
      btn.onclick = function() { currentFloor = f; renderTabs(); renderGrid(); };
      el.appendChild(btn);
    });
  }

  function renderStats() {
    var floorSpots = allSpots.filter(function(s){ return s.floor === currentFloor; });
    var avail = floorSpots.filter(function(s){ return s.status === 'available'; }).length;
    var occ = floorSpots.filter(function(s){ return s.status === 'occupied'; }).length;
    var maint = floorSpots.filter(function(s){ return s.status === 'maintenance'; }).length;
    var total = floorSpots.length;
    var el = document.getElementById('stats');
    el.innerHTML =
      '<div class="stat-card"><div class="stat-label">المجموع</div><div class="stat-value">' + total + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">متاح</div><div class="stat-value green">' + avail + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">مشغول</div><div class="stat-value red">' + occ + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">صيانة</div><div class="stat-value yellow">' + maint + '</div></div>';
  }

  function renderGrid() {
    var wrapper = document.getElementById('grid-wrapper');
    var tooltip = document.getElementById('tooltip');
    var floorSpots = allSpots.filter(function(s){ return s.floor === currentFloor; });
    var grid = document.createElement('div');
    grid.className = 'grid';

    floorSpots.forEach(function(spot) {
      var cell = document.createElement('div');
      cell.className = 'spot ' + spot.status;
      cell.title = spot.spotCode;

      cell.addEventListener('mouseenter', function(e) {
        var label = spot.spotCode + ' — ';
        if (spot.status === 'available') label += 'متاح';
        else if (spot.status === 'occupied') label += 'مشغول';
        else label += 'صيانة';
        tooltip.textContent = label;
        tooltip.style.display = 'block';
      });
      cell.addEventListener('mousemove', function(e) {
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top = (e.clientY + 14) + 'px';
      });
      cell.addEventListener('mouseleave', function() {
        tooltip.style.display = 'none';
      });

      cell.addEventListener('click', function() {
        var order = ['available', 'occupied', 'maintenance'];
        var next = order[(order.indexOf(spot.status) + 1) % order.length];
        var result = updateSpot(spot.id, next);
        if (result) {
          spot.status = next;
          renderGrid();
          renderStats();
        }
      });

      grid.appendChild(cell);
    });

    wrapper.innerHTML = '';
    wrapper.appendChild(grid);

    var countLabel = document.createElement('div');
    countLabel.className = 'spot-count-label';
    countLabel.textContent = FLOOR_LETTERS[currentFloor] + '-01 → ' + FLOOR_LETTERS[currentFloor] + '-250';
    wrapper.appendChild(countLabel);
  }

  autoLogin(function() {
    if (loadSpots()) {
      renderTabs();
      renderStats();
      renderGrid();
      setInterval(function() {
        if (loadSpots()) { renderStats(); renderGrid(); }
      }, 10000);
    } else {
      document.getElementById('loading').textContent = 'خطأ في تحميل البيانات';
    }
  });
})();
</script>
</body>
</html>
